# tb_ar_shim: keeps the Alpine Ridge Thunderbolt controllers alive across sleep on 2016-2017 MacBook Pros
# (README.md). DKMS rebuilds it for every new kernel. It loads by PCI ID (8086:1578) and only acts on the
# on-board controllers (Apple's ACPI methods under the bridge); anywhere else it refuses to load.
PACKAGE_NAME="tb-ar-shim-a1706"
PACKAGE_VERSION="1.0.0"
MAKE[0]="make KERNELRELEASE=${kernelver}"
CLEAN="make clean"
BUILT_MODULE_NAME[0]="tb_ar_shim"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
