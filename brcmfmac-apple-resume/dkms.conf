# brcmfmac with the fix for 5 GHz / Bluetooth after a resume on BCM43602 Macs
# (0001-brcmfmac-pcie-restore-Apple-EFI-chip-setup-after-resume.patch). DKMS rebuilds it for every new
# kernel: dkms-build.sh fetches the brcmfmac source of the kernel's upstream release (cached per version),
# applies the patch and builds it with the kernel's configuration. The vendor modules are built from the same
# source and installed with it, so all four always match.
PACKAGE_NAME="brcmfmac-apple-resume"
PACKAGE_VERSION="1.0"
MAKE[0]="sh ./dkms-build.sh ${kernelver}"
BUILD_EXCLUSIVE_CONFIG="CONFIG_BRCMFMAC"
BUILT_MODULE_NAME[0]="brcmfmac"
BUILT_MODULE_LOCATION[0]="build/brcm80211/brcmfmac/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="brcmfmac-wcc"
BUILT_MODULE_LOCATION[1]="build/brcm80211/brcmfmac/wcc/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="brcmfmac-cyw"
BUILT_MODULE_LOCATION[2]="build/brcm80211/brcmfmac/cyw/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
BUILT_MODULE_NAME[3]="brcmfmac-bca"
BUILT_MODULE_LOCATION[3]="build/brcm80211/brcmfmac/bca/"
DEST_MODULE_LOCATION[3]="/updates/dkms"
AUTOINSTALL="yes"
