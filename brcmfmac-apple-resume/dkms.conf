# brcmfmac with the fix for 5 GHz / Bluetooth after a resume on BCM43602 Macs
# (0001-brcmfmac-pcie-restore-Apple-EFI-chip-setup-after-resume.patch). DKMS rebuilds it for every new
# kernel: dkms-build.sh fetches the brcmfmac source of the kernel's upstream release (cached per version),
# applies the patch and builds it with the kernel's configuration. Only brcmfmac.ko is installed: the patch adds
# internal code only (no exported symbol changes), so the kernel's own vendor modules (brcmfmac-wcc/-cyw/-bca)
# work with it unchanged.
PACKAGE_NAME="brcmfmac-apple-resume"
PACKAGE_VERSION="1.0"
MAKE[0]="sh ./dkms-build.sh ${kernelver}"
BUILD_EXCLUSIVE_CONFIG="CONFIG_BRCMFMAC"
BUILT_MODULE_NAME[0]="brcmfmac"
BUILT_MODULE_LOCATION[0]="build/brcm80211/brcmfmac/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
