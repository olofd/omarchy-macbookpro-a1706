# "deep" (S3) sleep: tested on a MacBookPro13,2, about 33 mA (0.9 % of the battery per hour). s2idle works too
# but drained 82 % of the battery to empty in under 10 hours (no low-power idle state on these Macs). Deep
# needs the sleep hook (Thunderbolt removed before sleep, the T1 wake call after it); see docs/05-sleep.md.
w /sys/power/mem_sleep - - - - deep
