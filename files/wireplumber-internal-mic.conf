# omarchy-macbookpro-a1706 (scripts/install-sound.sh): the built-in mic's starting level. With the guide's
# driver patch the mic's gain follows the mixer, and PipeWire's usual 100% for a new microphone would be
# 24 dB above the level tested (speech would clip). 0.25 is 63 % in PipeWire's volume scale (-12 dB). Only
# used while WirePlumber has no saved level for the mic; change it as you like in the audio settings.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = { device.routes.default-source-volume = 0.25 } }
  }
]
