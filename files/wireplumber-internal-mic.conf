# omarchy-macbookpro-a1706 (scripts/install-sound.sh): the built-in mic's starting level. With the guide's
# driver patch the mic's gain follows the mixer. Measured on a MacBookPro13,2, dictating at a normal distance:
# at 100 % speech peaked at -4 dBFS (close to clipping), at 85 % around -13 to -8 dBFS, the right range for
# calls and dictation. 0.614 is 85 % in PipeWire's volume scale (0.85 cubed, -4 dB). Only used while
# WirePlumber has no saved level for the mic; change it as you like in the audio settings.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1f.3" } ]
    actions = { update-props = { device.routes.default-source-volume = 0.614 } }
  }
]
