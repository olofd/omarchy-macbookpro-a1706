# Suspend-then-hibernate as a safety net (docs/05-sleep.md): the lid sleeps in deep sleep as before, and after
# 12 hours asleep on battery the Mac wakes for a moment and hibernates, so the battery can never run flat. On
# the charger it stays in deep sleep (the 12 hours start when the charger is unplugged).
[Sleep]
HibernateDelaySec=12h
HibernateOnACPower=no
# Without a battery alarm, systemd wakes the Mac every SuspendEstimationSec (default 1 h) to measure the drain,
# and every wake runs the whole sleep hook (Thunderbolt, Wi-Fi). Measure at the 12-hour mark instead; a fast
# drain measured then still hibernates early.
SuspendEstimationSec=12h
